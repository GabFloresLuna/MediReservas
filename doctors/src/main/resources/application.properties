spring.application.name=doctors

server.port=9003

spring.datasource.url=jdbc:mysql://localhost:3313/doctors_db
spring.datasource.username=admin
spring.datasource.password=admin123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA: desactivar creación automática de tablas
spring.jpa.hibernate.ddl-auto=none

# Dialecto recomendado para MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Flyway: habilitar migraciones
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Definir el nivel de log global
logging.level.root=INFO

# Si quieres ver tus logs específicos de DUOC en modo detallado (DEBUG)
logging.level.cl.duoc.doctors=DEBUG

# Cambiar la ruta base de Swagger si lo deseas (Opcional)
springdoc.api-docs.path=/api-doc