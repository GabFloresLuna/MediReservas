server:
    port: 9013

spring:
    application:
        name: gateway
    cloud:
        gateway:
            discovery:
                locator:
                    enabled: true
                    lower-case-service-id: true
            routes:
                - id: login-service
                  uri: lb://login
                  predicates: 
                    -Path=/api/v1/login/**
                - id: democars-service
                  uri: lb://democars
                  predicates:
                    -Path=/api/v1/cars/** 
                