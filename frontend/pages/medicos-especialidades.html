<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Especialidades Médicas</title>
    </head>

    <body>
        <header>
            <h1>MediSalud</h1>

            <nav>
                <a href="dashboard.html">Inicio</a>
            </nav>
        </header>

        <main>
            <section id="especialidades">
                <h2>Especialidades médicas</h2>

                <p>Consulta las especialidades médicas disponibles</p>
            </section>

            <section>
                <label for="buscarEspecialidad"> Buscar especialidad </label>

                <br />

                <input type="text" id="buscarEspecialidad" placeholder="Ej: Cardiología" />
            </section>

            <br />

            <section>
                <div id="listaEspecialidades"></div>
                <div id="mensajeSinEspecialidades" style="display: none">
                    <p>No se encontraron especialidades.</p>
                </div>
            </section>
            <section id="medicos">
                <h2>Médicos</h2>

                <p>Consulta los médicos disponibles</p>

                <div>
                    <label for="buscarMedico"> Buscar médico </label>

                    <br />

                    <input type="text" id="buscarMedico" placeholder="Ej: Juan Pérez" />
                </div>

                <br />

                <div>
                    <label for="filtroEspecialidad"> Filtrar por especialidad </label>

                    <br />

                    <select id="filtroEspecialidad">
                        <option value="">Todas las especialidades</option>
                    </select>
                </div>
                <div id="listaMedicos"></div>
                <div id="mensajeSinMedicos" style="display: none">
                    <p>No se encontraron médicos.</p>
                </div>
                <div id="detalleMedico" style="display: none">
                    <h2>Detalle del médico</h2>

                    <p>
                        <strong>Nombre:</strong>
                        <span id="detalleNombre"></span>
                    </p>

                    <p>
                        <strong>Especialidad:</strong>
                        <span id="detalleEspecialidad"></span>
                    </p>

                    <p>
                        <strong>Registro médico:</strong>
                        <span id="detalleRegistro"></span>
                    </p>

                    <p>
                        <strong>Descripción:</strong>
                        <span id="detalleDescripcion"></span>
                    </p>

                    <button type="button" id="cerrarDetalle">Cerrar detalle</button>
                </div>
            </section>
        </main>

        <footer>
            <p>MediSalud</p>
        </footer>

        <script type="module" src="../assets/js/buscar.js"></script>
    </body>
</html>
