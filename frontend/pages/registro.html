<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta
            name="description"
            content="Crea una cuenta de paciente en MediReservas para solicitar y consultar horas médicas."
        >
        <title>Crear cuenta | MediReservas</title>
        <link rel="stylesheet" href="../assets/css/style.css">
    </head>
    <body>
        <header>
            <nav aria-label="Navegación de registro">
                <a href="../index.html" aria-label="Volver al inicio de MediReservas">
                    MediReservas
                </a>
                <p>¿Ya tienes una cuenta? <a href="login.html">Inicia sesión</a></p>
            </nav>
        </header>

        <main>
            <section aria-labelledby="register-title">
                <div>
                    <p>Registro de pacientes</p>
                    <h1 id="register-title">Crea tu cuenta</h1>
                    <p>Ingresa tus datos personales para comenzar a gestionar tus horas médicas.</p>
                </div>

                <form id="register-form" novalidate>
                    <fieldset>
                        <legend>Datos personales</legend>

                        <div>
                            <label for="run">RUN</label>
                            <input id="run" name="run" type="text" autocomplete="off">
                            <p id="run-help">Escríbelo sin puntos y con guion.</p>
                            <p id="run-error" role="alert"></p>
                        </div>

                        <div>
                            <label for="first-name">Nombre</label>
                            <input id="first-name" name="firstName" type="text" autocomplete="given-name">
                            <p id="first-name-error" role="alert"></p>
                        </div>

                        <div>
                            <label for="last-name">Apellidos</label>
                            <input id="last-name" name="lastName" type="text" autocomplete="family-name">
                            <p id="last-name-error" role="alert"></p>
                        </div>

                        <div>
                            <label for="birth-date">Fecha de nacimiento</label>
                            <input id="birth-date" name="birthDate" type="date" autocomplete="bday">
                            <p id="birth-date-error" role="alert"></p>
                        </div>

                        <div>
                            <label for="phone">Teléfono</label>
                            <input id="phone" name="phone" type="tel" autocomplete="tel">
                            <p id="phone-error" role="alert"></p>
                        </div>

                        <div>
                            <label for="address">Dirección</label>
                            <input id="address" name="address" type="text" autocomplete="street-address">
                            <p id="address-error" role="alert"></p>
                        </div>
                    </fieldset>

                    <fieldset>
                        <legend>Datos de acceso</legend>

                        <div>
                            <label for="email">Correo electrónico</label>
                            <input id="email" name="email" type="email" autocomplete="email">
                            <p id="email-error" role="alert"></p>
                        </div>

                        <div>
                            <label for="password">Contraseña</label>
                            <input id="password" name="password" type="password" autocomplete="new-password">
                            <p id="password-error" role="alert"></p>
                        </div>

                        <div>
                            <label for="password-confirmation">Confirmar contraseña</label>
                            <input
                                id="password-confirmation"
                                name="passwordConfirmation"
                                type="password"
                                autocomplete="new-password"
                            >
                            <p id="password-confirmation-error" role="alert"></p>
                        </div>
                    </fieldset>

                    <div>
                        <input id="terms" name="terms" type="checkbox">
                        <label for="terms">Acepto los términos de uso y la política de privacidad.</label>
                        <p id="terms-error" role="alert"></p>
                    </div>

                    <button type="submit">Crear cuenta</button>
                    <p id="register-message" role="status"></p>
                </form>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 MediReservas. Proyecto académico.</p>
            <a href="../index.html">Volver al inicio</a>
        </footer>
    </body>
</html>
